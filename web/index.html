<!DOCTYPE html>

<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>سامانه FWI ایران</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    @font-face {
      font-family: "BNazanin";
      src: local("B Nazanin");
    }

    * {
      box-sizing: border-box;
    }

    html,
    body,
    #map {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      font-family: BNazanin, Tahoma, Arial, sans-serif;
      background: #111;
    }

    .panel {
      position: absolute;
      z-index: 1000;
      top: 12px;
      right: 12px;
      width: 290px;
      padding: 14px 16px;
      border-radius: 12px;
      background: rgba(18, 18, 18, 0.94);
      color: #fff;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.35);
      line-height: 1.8;
    }

    .panel h1 {
      margin: 0 0 6px;
      font-size: 20px;
    }

    .date {
      color: #ffd166;
      font-size: 16px;
    }

    .legend {
      margin-top: 10px;
      display: grid;
      gap: 4px;
    }

    .legend div {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 14px;
    }

    .box {
      width: 24px;
      height: 14px;
      display: inline-block;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .status {
      margin-top: 8px;
      font-size: 13px;
      color: #ccc;
    }
  </style>

</head>

<body>

  <div id="map"></div>

  <div class="panel">

  <script

  <script>

    const map = L.map("map", {
      preferCanvas: true
    });

    /*
     * نقشه پایه
     */
    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",       {         maxZoom: 12,         attribution: "© OpenStreetMap contributors"       }     ).addTo(map);       /*      * بارگذاری نقشه      */     async function loadMap() {        /*        * ----------------------------------------------------        * 1. بارگذاری مرز ایران        * ----------------------------------------------------        */        const boundaryResponse =         await fetch(           "IRAN.geojson?ts=" + Date.now()         );        if (!boundaryResponse.ok) {          throw new Error(           "IRAN.geojson پیدا نشد."         );        }        const boundary =         await boundaryResponse.json();         /*        * ----------------------------------------------------        * 2. نمایش مرز ایران        * ----------------------------------------------------        */        const boundaryLayer =         L.geoJSON(           boundary,           {             style: {               color: "#ffffff",               weight: 2,               opacity: 1,               fill: false             }           }         ).addTo(map);         /*        * ----------------------------------------------------        * 3. دریافت Metadata مربوط به FWI        * ----------------------------------------------------        */        const metaResponse =         await fetch(           "fwi_iran_latest.json?ts=" +           Date.now()         );        if (!metaResponse.ok) {          throw new Error(           "فایل FWI هنوز ساخته نشده است."         );        }        const meta =         await metaResponse.json();         /*        * ----------------------------------------------------        * 4. خواندن BBOX        *        * ساختار JSON:        *        * bbox:        *   west        *   south        *   east        *   north        *        * ----------------------------------------------------        */        const b = meta.bbox;        if (         typeof b.west !== "number" ||         typeof b.south !== "number" ||         typeof b.east !== "number" ||         typeof b.north !== "number"       ) {          throw new Error(           "BBOX موجود در fwi_iran_latest.json معتبر نیست."         );        }         /*        * ----------------------------------------------------        * 5. ساخت Bounds صحیح برای Leaflet        *        * اصلاح مهم:        *        * قبلاً:        *        * b[1], b[0]        *        * استفاده شده بود.        *        * اما JSON دارای کلیدهای نام‌دار است.        * ----------------------------------------------------        */        const bounds = [         [b.south, b.west],         [b.north, b.east]       ];         /*        * ----------------------------------------------------        * 6. پیدا کردن نام فایل تصویر        *        * update_fwi.py این ساختار را تولید می‌کند:        *        * image:        *   file        *   width        *   height        *        * ----------------------------------------------------        */        if (         !meta.image ||         !meta.image.file       ) {          throw new Error(           "مسیر تصویر FWI در metadata وجود ندارد."         );        }        const imageUrl =         meta.image.file +         "?ts=" +         Date.now();         /*        * ----------------------------------------------------        * 7. نمایش FWI        * ----------------------------------------------------        */        const fwiLayer =         L.imageOverlay(           imageUrl,           bounds,           {             opacity: 0.72,             interactive: false           }         ).addTo(map);         /*        * ----------------------------------------------------        * 8. قرار دادن مرز روی تصویر        * ----------------------------------------------------        */        boundaryLayer.bringToFront();         /*        * ----------------------------------------------------        * 9. تنظیم نقشه روی ایران        * ----------------------------------------------------        */        map.fitBounds(         boundaryLayer.getBounds(),         {           padding: [10, 10]         }       );         /*        * ----------------------------------------------------        * 10. نمایش تاریخ        * ----------------------------------------------------        */        if (meta.forecast_gregorian) {          document.getElementById("date")           .textContent =           "تاریخ پیش‌بینی: " +           meta.forecast_gregorian;        }       else if (meta.date) {          document.getElementById("date")           .textContent =           "تاریخ پیش‌بینی: " +           meta.date;        }       else {          document.getElementById("date")           .textContent =           "تاریخ پیش‌بینی موجود نیست.";        }         /*        * ----------------------------------------------------        * 11. وضعیت سامانه        * ----------------------------------------------------        */        document.getElementById("status")         .textContent =         "منبع: Copernicus EFFIS / ECMWF GWIS";      }       /*      * ------------------------------------------------------      * اجرای برنامه      * ------------------------------------------------------      */      loadMap()       .catch(function(error) {          console.error(           "IR-FWI error:",           error         );          document.getElementById("date")           .textContent =           "خطا";          document.getElementById("status")           .textContent =           error.message;        });    </script>
