<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>سامانه FWI ایران</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #111;
      font-family: Tahoma, Arial, sans-serif;
    }

    #map {
      width: 100%;
      height: 100%;
      background: #111;
    }

    .panel {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 1000;

      background: rgba(15, 15, 15, 0.92);
      color: #fff;

      padding: 14px 16px;
      border-radius: 10px;

      min-width: 220px;

      box-shadow:
        0 4px 18px rgba(0, 0, 0, 0.45);
    }

    .title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .info {
      font-size: 13px;
      line-height: 1.9;
    }

    .status {
      margin-top: 8px;
      font-size: 12px;
      color: #ccc;
    }

    .legend {
      position: absolute;
      bottom: 20px;
      right: 15px;
      z-index: 1000;

      background: rgba(15, 15, 15, 0.92);
      color: white;

      padding: 10px;
      border-radius: 8px;

      font-size: 12px;
    }

    .legend-title {
      font-weight: bold;
      margin-bottom: 6px;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 3px 0;
    }

    .legend-color {
      width: 22px;
      height: 12px;
      border-radius: 2px;
    }

  </style>

</head>

<body>

  <div id="map"></div>

  <div class="panel">

    <div class="title">
      سامانه FWI ایران
    </div>

    <div class="info">

      <div>
        شاخص خطر آتش‌سوزی
      </div>

      <div id="date">
        تاریخ: در حال دریافت...
      </div>

      <div>
        منبع: Copernicus EFFIS / ECMWF GWIS
      </div>

    </div>

    <div
      id="status"
      class="status"
    >
      در حال بارگذاری نقشه...
    </div>

  </div>

  <div class="legend">

    <div class="legend-title">
      FWI
    </div>

    <div class="legend-row">
      <span
        class="legend-color"
        style="background:#00a651"
      ></span>
      خیلی کم
    </div>

    <div class="legend-row">
      <span
        class="legend-color"
        style="background:#9acd32"
      ></span>
      کم
    </div>

    <div class="legend-row">
      <span
        class="legend-color"
        style="background:#ffd400"
      ></span>
      متوسط
    </div>

    <div class="legend-row">
      <span
        class="legend-color"
        style="background:#f28c00"
      ></span>
      زیاد
    </div>

    <div class="legend-row">
      <span
        class="legend-color"
        style="background:#d7191c"
      ></span>
      بسیار زیاد
    </div>

  </div>


  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>


  <script>

    const map = L.map("map", {
      zoomControl: true,
      preferCanvas: true
    });


    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 18,
        attribution: "&copy; OpenStreetMap contributors"
      }
    ).addTo(map);


    const statusElement =
      document.getElementById("status");

    const dateElement =
      document.getElementById("date");


    async function loadMap() {

      try {

        statusElement.textContent =
          "در حال دریافت داده FWI...";


        // ----------------------------------------------------
        // Load Iran boundary
        // ----------------------------------------------------

        const boundaryResponse =
          await fetch("IRAN.geojson");

        if (!boundaryResponse.ok) {
          throw new Error(
            "IRAN.geojson قابل دریافت نیست."
          );
        }

        const boundaryData =
          await boundaryResponse.json();


        const boundaryLayer =
          L.geoJSON(
            boundaryData,
            {
              style: {
                color: "#ffffff",
                weight: 2,
                opacity: 1,
                fill: false
              }
            }
          ).addTo(map);


        // ----------------------------------------------------
        // Load FWI metadata
        // ----------------------------------------------------

        const metadataResponse =
          await fetch(
            "fwi_iran_latest.json?t=" +
            Date.now()
          );

        if (!metadataResponse.ok) {
          throw new Error(
            "fwi_iran_latest.json قابل دریافت نیست."
          );
        }

        const meta =
          await metadataResponse.json();


        // ----------------------------------------------------
        // IMPORTANT:
        // Use actual clipped raster bounds,
        // NOT the original WMS bbox.
        // ----------------------------------------------------

        const b = meta.image_bounds;

        if (
          !b ||
          typeof b.west !== "number" ||
          typeof b.south !== "number" ||
          typeof b.east !== "number" ||
          typeof b.north !== "number"
        ) {

          throw new Error(
            "image_bounds در فایل metadata وجود ندارد."
          );

        }


        const imageBounds = [
          [b.south, b.west],
          [b.north, b.east]
        ];


        // ----------------------------------------------------
        // FWI image
        // ----------------------------------------------------

        const imageUrl =
          meta.image.file +
          "?t=" +
          Date.now();


        L.imageOverlay(
          imageUrl,
          imageBounds,
          {
            opacity: 0.72,
            interactive: false
          }
        ).addTo(map);


        // ----------------------------------------------------
        // Fit exactly to Iran boundary
        // ----------------------------------------------------

        const boundaryBounds =
          boundaryLayer.getBounds();


        if (
          boundaryBounds &&
          boundaryBounds.isValid()
        ) {

          map.fitBounds(
            boundaryBounds,
            {
              padding: [10, 10]
            }
          );

        }


        // ----------------------------------------------------
        // Date
        // ----------------------------------------------------

        const forecastDate =
          meta.forecast_gregorian ||
          meta.date ||
          "-";


        dateElement.textContent =
          "تاریخ پیش‌بینی: " +
          forecastDate;


        statusElement.textContent =
          "نقشه FWI با مرز ایران بارگذاری شد.";


        console.log(
          "FWI metadata:",
          meta
        );

        console.log(
          "Raster image bounds:",
          imageBounds
        );

        console.log(
          "Iran boundary bounds:",
          boundaryBounds
        );

      }

      catch (error) {

        console.error(
          "FWI map error:",
          error
        );

        statusElement.textContent =
          "خطا در بارگذاری نقشه: " +
          error.message;

      }

    }


    loadMap();

  </script>

</body>

</html>
