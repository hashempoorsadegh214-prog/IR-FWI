<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>سامانه FWI ایران</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    @font-face {
      font-family: "BNazanin";
      src: local("B Nazanin");
    }

    * {
      box-sizing: border-box;
    }

    html,
    body,
    #map {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      font-family: BNazanin, Tahoma, Arial, sans-serif;
      background: #111;
    }

    .panel {
      position: absolute;
      z-index: 1000;
      top: 12px;
      right: 12px;
      width: 290px;
      padding: 14px 16px;
      border-radius: 12px;
      background: rgba(18,18,18,.94);
      color: #fff;
      box-shadow: 0 5px 20px rgba(0,0,0,.35);
      line-height: 1.8;
    }

    .panel h1 {
      margin: 0 0 6px;
      font-size: 20px;
    }

    .date {
      color: #ffd166;
      font-size: 16px;
    }

    .legend {
      margin-top: 10px;
      display: grid;
      gap: 4px;
    }

    .legend div {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 14px;
    }

    .box {
      width: 24px;
      height: 14px;
      display: inline-block;
      border: 1px solid rgba(255,255,255,.4);
    }

    .status {
      margin-top: 8px;
      font-size: 13px;
      color: #ccc;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <div class="panel">
    <h1>پیش‌بینی شاخص FWI ایران</h1>
    <div id="date" class="date">در حال بارگذاری...</div>

    <div class="legend">
      <div>
        <span class="box" style="background:#00a651"></span>
        کم
      </div>
      <div>
        <span class="box" style="background:#ffff00"></span>
        متوسط
      </div>
      <div>
        <span class="box" style="background:#ff9900"></span>
        زیاد
      </div>
      <div>
        <span class="box" style="background:#ff0000"></span>
        خیلی زیاد
      </div>
      <div>
        <span class="box" style="background:#990000"></span>
        بحرانی
      </div>
    </div>

    <div id="status" class="status">
      در حال دریافت داده...
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const map = L.map("map", {
      preferCanvas: true
    });

    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 12,
        attribution: "&copy; OpenStreetMap contributors"
      }
    ).addTo(map);

    async function loadMap() {
      const boundaryResponse =
        await fetch("IRAN.geojson?ts=" + Date.now());

      if (!boundaryResponse.ok) {
        throw new Error("IRAN.geojson پیدا نشد.");
      }

      const boundary =
        await boundaryResponse.json();

      const boundaryLayer =
        L.geoJSON(boundary, {
          style: {
            color: "#ffffff",
            weight: 2,
            opacity: 1,
            fill: false
          }
        }).addTo(map);

      const metaResponse =
        await fetch(
          "fwi_iran_latest.json?ts=" + Date.now()
        );

      if (!metaResponse.ok) {
        throw new Error(
          "فایل FWI هنوز ساخته نشده است."
        );
      }

      const meta =
        await metaResponse.json();

      const b = meta.bbox;

      const bounds = [
        [b[1], b[0]],
        [b[3], b[2]]
      ];

      const fwiLayer =
        L.imageOverlay(
          meta.image.url +
            "?ts=" + Date.now(),
          bounds,
          {
            opacity: 0.72,
            interactive: false
          }
        ).addTo(map);

      boundaryLayer.bringToFront();

      map.fitBounds(
        boundaryLayer.getBounds(),
        { padding: [10, 10] }
      );

      document.getElementById("date")
        .textContent =
        "تاریخ پیش‌بینی: " +
        meta.forecast_gregorian;

      document.getElementById("status")
        .textContent =
        "منبع: Copernicus EFFIS / ECMWF GWIS";
    }

    loadMap().catch(function(error) {
      console.error(error);

      document.getElementById("date")
        .textContent = "خطا";

      document.getElementById("status")
        .textContent = error.message;
    });
  </script>
</body>
</html>
