name: Update Iran FWI

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-fwi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests geopandas shapely pillow

      - name: Build Iran FWI
        run: |
          python scripts/update_fwi.py

      - name: Check generated files
        run: |
          test -f web/index.html
          test -f web/fwi_iran_latest.png
          test -f web/fwi_iran_latest.json
          ls -lh web/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Save generated FWI files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/fwi_iran_latest.png web/fwi_iran_latest.json

          if git diff --cached --quiet; then
            echo "No generated-data changes to commit."
          else
            git commit -m "Update Iran FWI forecast"
            git push
          fi
